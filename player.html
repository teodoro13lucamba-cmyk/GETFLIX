<body class="player-page">

<header id="header">
  <div class="header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">▶</span>
      <span class="logo-name">GETFLIX</span>
    </a>
    <button class="back-btn" id="backBtn" aria-label="Voltar para página inicial">← Voltar</button>
  </div>
</header>

<div class="player-wrap">
  <div class="info-row">
    <div class="player-poster">
      <img id="playerPoster" src="" alt="" loading="lazy">
    </div>
    <div class="player-details">
      <div class="p-tags" id="pTags"></div>
      <h1 class="p-title" id="pTitle">A carregar…</h1>
      <div class="p-meta" id="pMeta"></div>
      <p class="p-overview" id="pOverview"></p>
    </div>
  </div>

  <div class="embed-box">
    <div class="embed-loading" id="embedLoading">
      <div class="spin"></div>
      <p>A carregar o vídeo…</p>
    </div>
    <div class="embed-empty" id="noTrailer" style="display:none">
      <p>Vídeo não disponível para este título.</p>
    </div>
    <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer" title="Player de vídeo"></iframe>
  </div>

  <div class="srv-bar server-bar">
    <span class="srv-label">Servidor</span>
    <div class="srv-btns" id="serverButtons">
      <button class="srv-btn" data-server="superflix">SuperFlix</button>
      <button class="srv-btn" data-server="vidsrc">VidSrc</button>
      <button class="srv-btn" data-server="vidlink">Vidlink</button>
    </div>
  </div>

  <section class="eps-section" id="epsSection" style="display:none">
    <div class="eps-hdr">
      <h2>Episódios</h2>
      <div class="season-pick">
        <label for="seasonSelect">Temporada</label>
        <select id="seasonSelect"></select>
      </div>
    </div>
    <div class="eps-grid" id="epsGrid"></div>
  </section>

  <section class="recs-section" id="recsSection">
    <h2 class="sec-title">Poderá também gostar</h2>
    <div class="recs-grid" id="recsGrid"></div>
  </section>
</div>

<footer>
  <div class="footer-in">
    <div class="footer-logo">
      <span class="logo-mark">▶</span>
      <span class="logo-name">GETFLIX</span>
    </div>

    </div>
